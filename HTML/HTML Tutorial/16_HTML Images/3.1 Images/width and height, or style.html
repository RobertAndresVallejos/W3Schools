<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>width and height, or style</title>
        <meta charset="utf-8">
        <style>
            img{
                width: 100%;
            }
        </style>
    </head>
    <body>
        <p>La première image utilise l'attribut width (128 pixels), mais le style de la section head le remplace et fixe la largeur à 100% :</p>
        <img src="html5.gif" alt="HTML5 Icon" width="128" height="128">
        <p>La deuxième image utilise l'attribut style pour fixer la largeur à 128 pixels, afin qu'elle ne soit pas remplacée par le style de la section head :</p>
        <img src="html5.gif" alt="HTML5 Icon" style="width:128px;height:128px">

        <br>
        
        <a href="ex.html">page précédente</a>
    </body>
</html>

<!DOCTYPE html>
<html lang="fr">
    <head>
        <style>
            a:link{
                color: green;
                background-color: transparent;
                text-decoration: none;
            }
            a:visited{
                color: pink;
                background-color: transparent;
                text-decoration: underline;
            }
            a:hover{
                color: red;
                background-color: transparent;
                text-decoration: underline;
            }
            a:active{
                color:yellow;
                background-color: transparent;
                text-decoration: underline;
            }
        </style>
        <title>Couleurs des liens HTML.html</title>
        <meta charset="utf-8">
    </head>
    <body>
        <h1>Couleurs des liens HTML.html</h1>
        <p>Vous pouvez modifier les couleurs par défaut des liens.</p>

</html>

<!DOCTYPE html>
<html lang="fr">
    <head>
        <style>
            a:link{
                color: green;
                background-color: transparent;
                text-decoration: none;
            }
            a:visited{
                color: pink;
                background-color: transparent;
                text-decoration: none;
            }
            a:hover{
                color: red;
                background-color: transparent;
                text-decoration: underline;
            }
            a:active{
                color:yellow;
                background-color: transparent;
                text-decoration: underline;
            }
        </style>
        <title>HTML Link Colors</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="../../../../style.css">
    </head>
